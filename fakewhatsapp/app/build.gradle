plugins {
    id 'com.android.application' version '8.11.1'
}

def supabase = new Properties()
def configFile = rootProject.file('supabase.properties')
if (configFile.isFile()) {
    configFile.withReader('UTF-8') { supabase.load(it) }
}

android {
    namespace 'com.fakewhatsapp.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.fakewhatsapp.app'
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName '0.1.0'

        buildConfigField 'String', 'SUPABASE_URL',
                groovy.json.JsonOutput.toJson(supabase.getProperty('SUPABASE_URL', '').trim())
        buildConfigField 'String', 'SUPABASE_PUBLISHABLE_KEY',
                groovy.json.JsonOutput.toJson(supabase.getProperty('SUPABASE_PUBLISHABLE_KEY', '').trim())
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
